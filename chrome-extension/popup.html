<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALI2WOO Product Importer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .container {
        padding: 24px;
      }

      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .logo {
        width: 64px;
        height: 64px;
        background: white;
        border-radius: 16px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }

      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 14px;
        opacity: 0.9;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        color: #1f2937;
        margin-bottom: 16px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #374151;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #3b82f6;
      }

      .button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      .button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .status {
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-top: 12px;
        display: none;
      }

      .status.success {
        background: #d1fae5;
        color: #065f46;
        display: block;
      }

      .status.error {
        background: #fee2e2;
        color: #991b1b;
        display: block;
      }

      .footer {
        text-align: center;
        font-size: 12px;
        opacity: 0.8;
        margin-top: 16px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">🛒</div>
        <h1>ALI2WOO Importer</h1>
        <p class="subtitle">Import products with AI optimization</p>
      </div>

      <div class="stats" id="stats" style="display: none">
        <div class="stat-card">
          <div class="stat-value" id="productCount">0</div>
          <div class="stat-label">Products</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="todayCount">0</div>
          <div class="stat-label">Today</div>
        </div>
      </div>

      <div class="card">
        <form id="settingsForm">
          <div class="form-group">
            <label for="apiUrl">API URL</label>
            <input
              type="url"
              id="apiUrl"
              placeholder="https://your-store.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="authToken">Auth Token</label>
            <input
              type="password"
              id="authToken"
              placeholder="Your authentication token"
              required
            />
          </div>
          <button type="submit" class="button" id="saveBtn">
            Save Settings
          </button>
          <div class="status" id="status"></div>
        </form>
      </div>

      <div class="footer">
        Visit an AliExpress product page and click "Import to Store"
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
